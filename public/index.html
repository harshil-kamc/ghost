<!DOCTYPE html>
<html>
<head>
    <title>ghost</title>
</head>
<body bgcolor="#000000" text="#FFFFFF">

    <!-- Anchor tags placed side by side -->
    <a href="?path=FSD">FSD</a> 
    <a href="?path=DAA">DAA</a> 
    <a href="?path=CN">CN</a> 
    <a href="?path=OS">OS</a>

    <hr>

    <!-- Empty div where the explorer will load -->
    <div id="display"></div>

    <script>
        const GITHUB_USER = "harshil-kamc";
        const GITHUB_REPO = "ghost";
        const BRANCH = "main"; 
        const BASE_DIR = "public"; 

        const urlParams = new URLSearchParams(window.location.search);
        const currentPath = urlParams.get('path');
        const displayDiv = document.getElementById('display');

        // Function to generate the clickable breadcrumb path
        function getBreadcrumb(path) {
            // Always start with the root link
            let breadcrumb = `<a href="./">root</a>`;
            
            if (!path) return breadcrumb;

            // Split "FSD/1.1_Components" into an array
            const parts = path.split('/');
            let accumulatedPath = "";

            // Build the path piece by piece
            parts.forEach(part => {
                accumulatedPath += (accumulatedPath === "" ? part : "/" + part);
                breadcrumb += ` > <a href="?path=${accumulatedPath}">${part}</a>`;
            });

            return breadcrumb;
        }

        if (currentPath) {
            // Ask GitHub API what is at this path
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${BASE_DIR}/${currentPath}?ref=${BRANCH}`;
            
            fetch(apiUrl)
                .then(response => {
                    if(!response.ok) throw new Error("Path not found");
                    return response.json();
                })
                .then(data => {
                    // Generate the breadcrumb path
                    const breadcrumbHtml = `<h3>${getBreadcrumb(currentPath)}</h3><hr>`;

                    // IF IT IS A FOLDER (API returns an Array)
                    if (Array.isArray(data)) {
                        let html = breadcrumbHtml;
                        
                        data.forEach(file => {
                            if (file.type === 'dir') {
                                html += `<a href="?path=${currentPath}/${file.name}">[DIR] ${file.name}</a><br>`;
                            } else {
                                html += `<a href="?path=${currentPath}/${file.name}">${file.name}</a><br>`;
                            }
                        });
                        
                        if (data.length === 0) {
                            html += `<p>[Empty Folder]</p>`;
                        }
                        
                        displayDiv.innerHTML = html;
                    } 
                    // IF IT IS A FILE (API returns an Object with download_url)
                    else if (data && data.type === 'file') {
                        fetch(data.download_url)
                            .then(res => res.text())
                            .then(text => {
                                let html = breadcrumbHtml;
                                html += `<pre style="font-family: monospace;">${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>`;
                                displayDiv.innerHTML = html;
                            });
                    }
                })
                .catch(err => {
                    displayDiv.innerHTML = `<p>Error loading path: It might not exist.</p>`;
                });
        }
    </script>
</body>
</html>
