<!DOCTYPE html>
<html>
<head>
    <title>ghost</title>
</head>
<!-- user-select: none prevents selecting text on the page by default -->
<body bgcolor="#000000" text="#808080" style="user-select: none; -webkit-user-select: none;">

    <!-- Anchor tags placed side by side -->
    <a href="?path=FSD">FSD</a> 
    <a href="?path=DAA">DAA</a> 
    <a href="?path=CN">CN</a> 
    <a href="?path=OS">OS</a>

    <hr>

    <!-- The toggle button for the path (Stealth SVG) -->
    <div id="ui-controls" style="display: none; margin-bottom: 10px;">
        <button id="path-btn" onclick="togglePath()" title="Toggle Path" style="background: transparent; border: none; color: #808080; cursor: pointer; padding: 0; outline: none;">
            <svg id="path-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </button>
    </div>
    
    <!-- Breadcrumb container (Hidden by default) -->
    <div id="path-container" style="display: none; margin-bottom: 15px; color: #808080; word-break: break-all; border-bottom: 1px solid #333; padding-bottom: 10px;"></div>
    
    <!-- Main Content Container -->
    <div id="content-container"></div>

    <script>
        const GITHUB_USER = "harshil-kamc";
        const GITHUB_REPO = "ghost";
        const BRANCH = "main"; 
        const BASE_DIR = "public"; 

        const urlParams = new URLSearchParams(window.location.search);
        const rawPath = urlParams.get('path');
        const currentPath = rawPath ? rawPath.replace(/^\/+|\/+$/g, '') : null;

        let currentFileContent = "";

        // Function to toggle the breadcrumb visibility
        function togglePath() {
            const pathContainer = document.getElementById('path-container');
            const icon = document.getElementById('path-icon');
            if (pathContainer.style.display === 'none') {
                pathContainer.style.display = 'block';
                // Change to Up Arrow
                icon.innerHTML = '<polyline points="18 15 12 9 6 15"></polyline>';
            } else {
                pathContainer.style.display = 'none';
                // Change to Down Arrow
                icon.innerHTML = '<polyline points="6 9 12 15 18 9"></polyline>';
            }
        }

        // Function to copy the code content
        function copyContent() {
            if (currentFileContent) {
                navigator.clipboard.writeText(currentFileContent).then(() => {
                    const icon = document.getElementById('copy-icon');
                    if(icon) {
                        const originalSVG = icon.innerHTML;
                        // Change to Checkmark
                        icon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
                        setTimeout(() => { icon.innerHTML = originalSVG; }, 2000);
                    }
                }).catch(err => {
                    alert("Failed to copy: " + err);
                });
            }
        }

        // Function to generate the explorer breadcrumbs
        function getBreadcrumb(path) {
            let breadcrumb = `<a href="./">root</a>`;
            if (!path) return breadcrumb;
            
            const parts = path.split('/');
            let accumulatedPath = "";
            
            parts.forEach(part => {
                accumulatedPath += (accumulatedPath === "" ? part : "/" + part);
                breadcrumb += ` > <a href="?path=${encodeURIComponent(accumulatedPath)}">${part}</a>`;
            });
            
            return breadcrumb;
        }

        if (currentPath) {
            // Show the path toggle button when a directory is opened
            document.getElementById('ui-controls').style.display = 'block';
            
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${BASE_DIR}/${currentPath}?ref=${BRANCH}`;
            
            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        if (response.status === 403) throw new Error("GitHub API rate limit exceeded. Please wait an hour.");
                        if (response.status === 404) throw new Error("Path not found. Make sure your repo is PUBLIC.");
                        throw new Error("HTTP Error: " + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    // Populate the hidden breadcrumb container
                    document.getElementById('path-container').innerHTML = getBreadcrumb(currentPath);

                    // IF IT IS A FOLDER
                    if (Array.isArray(data)) {
                        let html = '';
                        
                        if (currentPath.includes('/')) {
                            const parentPath = currentPath.substring(0, currentPath.lastIndexOf('/'));
                            html += `<a href="?path=${encodeURIComponent(parentPath)}">[.. Go Up]</a><br><br>`;
                        }

                        data.forEach(file => {
                            const filePath = `${currentPath}/${file.name}`;
                            if (file.type === 'dir') {
                                html += `<a href="?path=${encodeURIComponent(filePath)}">[DIR] ${file.name}</a><br>`;
                            } else {
                                html += `<a href="?path=${encodeURIComponent(filePath)}">${file.name}</a><br>`;
                            }
                        });

                        if (data.length === 0) html += `<p>[Empty Folder]</p>`;
                        
                        document.getElementById('content-container').innerHTML = html;
                    } 
                    // IF IT IS A FILE
                    else if (data && data.type === 'file') {
                        fetch(data.download_url)
                            .then(res => {
                                if (!res.ok) throw new Error("Could not fetch raw file content.");
                                return res.text();
                            })
                            .then(text => {
                                currentFileContent = text;
                                
                                const fileName = currentPath.split('/').pop();
                                
                                // Use SVG for copy button, no text, completely stealthy
                                let html = `
                                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                                        <h3 style="margin: 0;">File: ${fileName}</h3>
                                        <button id="copy-btn" onclick="copyContent()" title="Copy Code" style="background: transparent; border: none; color: #808080; cursor: pointer; padding: 0; outline: none; display: flex; align-items: center;">
                                            <svg id="copy-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                            </svg>
                                        </button>
                                    </div>
                                `;
                                
                                // user-select: text re-enables copying ONLY for the code block
                                html += `<pre style="font-family: monospace; user-select: text; -webkit-user-select: text; margin-top: 0;">${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>`;
                                
                                document.getElementById('content-container').innerHTML = html;
                            })
                            .catch(err => {
                                document.getElementById('content-container').innerHTML = `<p>Error reading file: ${err.message}</p>`;
                            });
                    }
                })
                .catch(err => {
                    document.getElementById('content-container').innerHTML = `<p>Error: ${err.message}</p>`;
                });
        }
    </script>
</body>
</html>
